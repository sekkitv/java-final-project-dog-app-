services:
  db:
    image: postgres:16-alpine
    container_name: zuzdog-db
    environment:
      POSTGRES_DB: zuzdog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5433:5432'
    volumes:
      - zuzdog_pg_data:/var/lib/postgresql/data
      - ./backend/zuzdog-backend/src/main/resources/db/schemas/init-postgresql.sql:/docker-entrypoint-initdb.d/1-init-postgresql.sql
      - ./backend/zuzdog-backend/src/main/resources/db/schemas/mock-data.sql:/docker-entrypoint-initdb.d/2-mock-data.sql
    # The backend runs spring.sql.init on startup so it must wait for this
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d zuzdog']
      interval: 5s
      timeout: 5s
      retries: 10
# container for each of us so we could run the activemq 
  message-broker:
    image: apache/activemq-classic:5.18.3
    container_name: zuzdog-mq
    ports:
      - '61616:61616'
      - '8161:8161'

  # the two below run the whole app in containers, so no local JDK or node is
  # needed. the frontend here uses the same nginx image as railway, which is how
  # we test routing before deploying.
  # `docker compose up -d db message-broker` still starts just the infra.
  backend:
    build: ./backend/zuzdog-backend
    container_name: zuzdog-backend
    depends_on:
      db:
        condition: service_healthy
      message-broker:
        condition: service_started
    environment:
      # service names, not localhost - each container is its own host here
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/zuzdog
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_ACTIVEMQ_BROKER_URL: tcp://message-broker:61616
      APP_UPLOAD_DIR: /app/uploads
    ports:
      - '8080:8080'
    volumes:
      # keeps uploaded photos across rebuilds, same idea as zuzdog_pg_data
      - zuzdog_uploads:/app/uploads

  frontend:
    build: ./frontend
    container_name: zuzdog-frontend
    depends_on:
      - backend
    environment:
      # nginx proxies /api, /auth and /uploads here (see frontend/nginx.conf)
      BACKEND_URL: http://backend:8080
    ports:
      - '5173:80'

volumes:
  zuzdog_pg_data:
  zuzdog_uploads:
