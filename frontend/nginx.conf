# nginx config template for the Vite/React SPA.
# Serves the built bundle and reverse-proxies the same paths the
# Vite dev server proxies (see vite.config.js) to the backend service.
#
# This file is processed by the nginx image's entrypoint via envsubst,
# so ${BACKEND_URL} is replaced at container start from the environment.
# Defaults to http://127.0.0.1:8080 for local docker runs.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip text assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Proxy API, auth and uploads to the backend service.
    location /api/      { proxy_pass ${BACKEND_URL}; }
    location /auth/     { proxy_pass ${BACKEND_URL}; }
    location /uploads/  { proxy_pass ${BACKEND_URL}; }

    # Standard proxy headers
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    proxy_read_timeout 60s;

    # SPA fallback: serve index.html for any non-asset route
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache immutable hashed assets
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|png|jpe?g|gif|svg|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
