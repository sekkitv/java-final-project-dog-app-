# nginx config template for the Vite/React SPA.
# Serves the built bundle and reverse-proxies the same paths the
# Vite dev server proxies (see vite.config.js) to the backend service.
#
# This file is processed by the nginx image's entrypoint via envsubst,
# so ${BACKEND_URL} is replaced at container start from the environment.
# Defaults to http://127.0.0.1:8080 for local docker runs.

server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Browsers send cookies scoped to the shared .up.railway.app domain,
    # which can exceed nginx's tiny default header buffers (1k/8k).
    client_header_buffer_size 16k;
    large_client_header_buffers 8 16k;

    # Gzip text assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Resolve the backend on every request instead of once at startup.
    # A literal host in proxy_pass is resolved when nginx boots and cached for
    # the life of the process, so a backend restart (which changes its private
    # IP) leaves every proxied request timing out until the frontend is
    # redeployed too. A variable in proxy_pass defers resolution to request time.
    # NGINX_LOCAL_RESOLVERS is exported by the nginx image entrypoint from
    # /etc/resolv.conf, so this works on Railway and in docker-compose alike.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;
    set $backend ${BACKEND_URL};

    # Proxy API, auth and uploads to the backend service.
    # /uploads/ needs ^~ so it beats the image-extension regex block below.
    # Without it nginx matches the regex first and 404s every uploaded photo.
    # $request_uri is required: a variable in proxy_pass stops nginx from
    # forwarding the original path automatically.
    location /api/      { proxy_pass $backend$request_uri; }
    location /auth/     { proxy_pass $backend$request_uri; }
    location ^~ /uploads/  { proxy_pass $backend$request_uri; }

    # Standard proxy headers
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    proxy_read_timeout 60s;

    # SPA fallback: serve index.html for any non-asset route
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache immutable hashed assets
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|png|jpe?g|gif|svg|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
