# This is the main configuration file , it contains the database connection and important properties.
# Our app name is zuzdog, and we are running our database on a postgresql server.

spring.application.name=zuzdog

spring.datasource.url=jdbc:postgresql://localhost:5433/zuzdog
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

app.upload.dir=uploads

server.port=8080

#in reallity we wont put it on github or something we have to keep this in private 
app.security.pepper=${PAWMATCH_PEPPER:woofwoof}
app.security.session-ttl-minutes=1440
app.feed.default-limit=20

#active mq properties define user password and broker url to send requests 
spring.activemq.broker-url=tcp://localhost:61616
spring.activemq.user=admin
spring.activemq.password=admin