# This is the main configuration file , it contains the database connection and important properties.
# Our app name is zuzdog, and we are running our database on a postgresql server.

spring.application.name=zuzdog

spring.datasource.url=jdbc:postgresql://localhost:5432/zuzdog
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

server.port=8080

app.security.pepper=${PAWMATCH_PEPPER:change-me-in-production}
app.security.session-ttl-minutes=1440
app.feed.default-limit=20
