# This is the main configuration file , it contains the database connection and important properties.
# Our app name is zuzdog, and we are running our database on a postgresql server.
#
# Values are read from environment variables first (so the same image runs on
# Railway and locally); the part after the colon is the local-dev fallback.

spring.application.name=zuzdog

# --- Database ---
# On Railway, set SPRING_DATASOURCE_URL/USERNAME/PASSWORD (see RAILWAY-SETUP).
# Locally docker-compose exposes Postgres on host port 5433.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/zuzdog}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Auto-init schema + mock data on every startup. Both scripts are idempotent
# (CREATE TABLE IF NOT EXISTS / INSERT ... ON CONFLICT DO NOTHING), so this is
# safe to leave on. Set SQL_INIT_MODE=never to disable.
spring.sql.init.mode=${SQL_INIT_MODE:always}
spring.sql.init.schema-locations=classpath:db/schemas/init-postgresql.sql
spring.sql.init.data-locations=classpath:db/schemas/mock-data.sql
spring.sql.init.continue-on-error=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Upload directory. On Railway, mount a persistent volume at /app/uploads and
# set APP_UPLOAD_DIR=/app/uploads (already the default in the Dockerfile).
app.upload.dir=${APP_UPLOAD_DIR:uploads}

# Railway injects PORT; fall back to 8080 for local runs.
server.port=${PORT:8080}

# In reality we wont put it on github or something we have to keep this in private
app.security.pepper=${PAWMATCH_PEPPER:woofwoof}
app.security.session-ttl-minutes=1440
app.feed.default-limit=20

# ActiveMQ properties: user, password and broker url to send requests.
spring.activemq.broker-url=${SPRING_ACTIVEMQ_BROKER_URL:tcp://localhost:61616}
spring.activemq.user=${SPRING_ACTIVEMQ_USER:admin}
spring.activemq.password=${SPRING_ACTIVEMQ_PASSWORD:admin}

# Expose actuator health endpoint for Railway healthchecks.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never